name: Release preflight

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-package-docs:
    name: Quality, package, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Project Environment
        uses: ./.github/actions/setup-project
        with:
          docs-submodule-token: ${{ secrets.CORE_DOCS_ASSETS_READ }}

      - name: Run Ruff
        run: uv run ruff check .

      - name: Build documentation strictly
        run: uv run --only-group docs mkdocs build --strict

      - name: Smoke-test built wheel
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          uv tool run --isolated --from "$wheel" g4x-helpers --version
          uv tool run --isolated --from "$wheel" g4x-helpers --help

  pytest:
    name: Pytest
    uses: ./.github/workflows/pytest-run.yml
    secrets: inherit

  docker:
    name: Docker
    uses: ./.github/workflows/docker-build.yml
    with:
      push: false
      ref_name: preflight-${{ github.sha }}
