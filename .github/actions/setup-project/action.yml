name: Setup project environment
description: Checkout repo + optional docs core assets, set up project with uv

inputs:
  docs-submodule-token:
    description: Token used to fetch private docs core assets
    required: false
    default: ''

runs:
  using: composite

  steps:
    - name: Checkout repo
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
        clean: false

    - name: Clone docs core assets
      if: ${{ inputs.docs-submodule-token != '' }}
      shell: bash
      env:
        DOCS_CORE_TOKEN: ${{ inputs.docs-submodule-token }}
      run: |
        rm -rf docs/_core
        git clone \
          --depth 1 \
          --branch main \
          "https://x-access-token:${DOCS_CORE_TOKEN}@github.com/Singular-Genomics/docs_core_assets.git" \
          docs/_core
        git -C docs/_core remote set-url origin "https://github.com/Singular-Genomics/docs_core_assets.git"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version-file: pyproject.toml

    - name: Build project
      shell: bash
      run: |
        uv sync --no-progress
        uv build
